                            <span onClick={() => navigate(-1)} className="material-symbols-outlined cursor-pointer text-[28px]">chevron_left</span>
                            <h1 className="text-lg font-bold">Notifications</h1>
                            <button className="text-primary text-sm font-semibold">Mark all as read</button>
                        </div>
                    </header>
                    <main className="px-4 space-y-6">
                        <h2 className="text-xs font-bold text-gray-400 uppercase tracking-widest px-1">Today</h2>
                        <div className="space-y-3">
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex gap-4 relative">
                                <div className="absolute top-4 right-4 size-2 bg-primary rounded-full"></div>
                                <div className="size-10 bg-primary/10 rounded-full flex items-center justify-center text-primary"><span className="material-symbols-outlined fill">notifications</span></div>
                                <div className="flex-1">
                                    <div className="flex justify-between mb-0.5"><p className="text-[15px] font-bold">New listing near you</p><span className="text-xs text-gray-400">2m ago</span></div>
                                    <p className="text-sm text-gray-600">Fresh Apples are available for pickup at 5th Avenue.</p>
                                </div>
                            </div>
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex gap-4 relative">
                                <div className="size-10 bg-warning/10 rounded-full flex items-center justify-center text-warning"><span className="material-symbols-outlined fill">favorite</span></div>
                                <div className="flex-1">
                                    <div className="flex justify-between mb-0.5"><p className="text-[15px] font-bold">Impact Milestone!</p><span className="text-xs text-gray-400">1h ago</span></div>
                                    <p className="text-sm text-gray-600">You earned the <span className="font-semibold text-warning">Waste Warrior</span> badge!</p>
                                </div>
                            </div>
                        </div>
                    </main>
                    <BottomNav activeTab="notifications" />
                </div>
            );
        };

        const SettingsScreen = () => {
            const navigate = useNavigate();
            return (
                <div className="min-h-screen bg-off-white pb-32">
                    <TopBar title="Settings" showBack />
                    <main className="px-6 pt-2">
                        <section className="mb-10">
                            <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><span className="material-symbols-outlined text-primary">restaurant</span>Dietary Preferences</h2>
                            <div className="grid grid-cols-2 gap-3">
                                {['Vegan', 'Vegetarian', 'Gluten-Free', 'Nut-Free', 'Halal', 'Dairy-Free'].map(pref => (
                                    <button key={pref} className={`px-4 py-3 rounded-full border-2 font-semibold transition-all ${pref === 'Vegan' || pref === 'Gluten-Free' ? 'bg-primary border-primary text-white' : 'border-primary/20 bg-white text-gray-700'}`}>{pref}</button>
                                ))}
                            </div>
                        </section>
                        <section className="mb-10">
                            <div className="flex justify-between items-end mb-6">
                                <h2 className="text-lg font-bold flex items-center gap-2"><span className="material-symbols-outlined text-primary">distance</span>Discovery Radius</h2>
                                <span className="text-primary font-bold text-xl">8 km</span>
                            </div>
                            <input className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary" type="range" value="8" />
                        </section>
                        <section className="mb-10">
                            <h2 className="text-lg font-bold mb-6 flex items-center gap-2"><span className="material-symbols-outlined text-primary">notifications</span>Notifications</h2>
                            <div className="space-y-6">
                                {['New Items Nearby', 'Messages'].map(item => (
                                    <div key={item} className="flex items-center justify-between">
                                        <div><p className="font-semibold">{item}</p></div>
                                        <div className="w-12 h-6 bg-primary rounded-full relative"><div className="absolute right-1 top-1 size-4 bg-white rounded-full"></div></div>
                                    </div>
                                ))}
                            </div>
                        </section>
                        <button onClick={() => navigate('/help')} className="w-full py-4 bg-white border border-gray-200 rounded-xl font-bold flex items-center justify-center gap-2 mb-4"><span className="material-symbols-outlined">help</span>Help & Support</button>
                    </main>
                    <div className="fixed bottom-0 left-0 right-0 p-6 bg-white border-t"><button onClick={() => navigate(-1)} className="w-full bg-primary text-white py-4 rounded-full font-bold shadow-lg">Save Preferences</button></div>
                </div>
            );
        };

        const HelpSupport = () => {
            const navigate = useNavigate();
            return (
                <div className="min-h-screen bg-background-light">
                    <TopBar title="Help & Support" showBack />
                    <div className="px-6 py-6">
                        <div className="relative mb-8">
                            <span className="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400">search</span>
                            <input className="w-full h-14 pl-12 pr-4 rounded-2xl bg-white border-none shadow-sm" placeholder="How can we help you?" />
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            {[
                                { icon: 'health_and_safety', label: 'Food Safety', color: 'bg-green-100' },
                                { icon: 'swap_horiz', label: 'How to Swap', color: 'bg-orange-100' },
                                { icon: 'person', label: 'My Account', color: 'bg-blue-100' },
                                { icon: 'military_tech', label: 'Impact & Badges', color: 'bg-purple-100' }
                            ].map((item, i) => (
                                <div key={i} className="glass-card p-5 rounded-2xl flex flex-col items-start gap-3">
                                    <div className={`w-10 h-10 rounded-xl ${item.color} flex items-center justify-center text-primary`}><span className="material-symbols-outlined">{item.icon}</span></div>
                                    <span className="font-semibold text-sm">{item.label}</span>
                                </div>
                            ))}
                        </div>
                        <div className="mt-12 bg-white p-8 rounded-[2.5rem] text-center shadow-lg">
                            <h3 className="text-xl font-bold mb-2">Still need help?</h3>
                            <div className="space-y-3 mt-8">
                                <button className="w-full bg-primary text-white h-14 rounded-full font-bold shadow-lg">Chat with Support</button>
                                <button className="w-full bg-accent-orange text-white h-14 rounded-full font-bold shadow-lg">Email Us</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App ---

        const App = () => {
            return (
                <MemoryRouter>
                    <Routes>
                        <Route path="/" element={<WelcomeOnboarding />} />
                        <Route path="/onboarding2" element={<Onboarding2 />} />
                        <Route path="/onboarding3" element={<Onboarding3 />} />
                        <Route path="/auth" element={<AuthScreen />} />
                        <Route path="/home" element={<LandingHome />} />
                        <Route path="/explore" element={<ExploreMap />} />
                        <Route path="/item/:id" element={<ItemDetails />} />
                        <Route path="/chat/:id" element={<ChatScreen />} />
                        <Route path="/donate/step1" element={<DonateStep1 />} />
                        <Route path="/donate/step2" element={<DonateStep2 />} />
                        <Route path="/donate/step3" element={<DonateStep3 />} />
                        <Route path="/success" element={<SuccessScreen />} />
                        <Route path="/profile" element={<ImpactProfile />} />
                        <Route path="/leaderboard" element={<LeaderboardScreen />} />
                        <Route path="/notifications" element={<NotificationsScreen />} />
                        <Route path="/settings" element={<SettingsScreen />} />
                        <Route path="/help" element={<HelpSupport />} />
                    </Routes>
                </MemoryRouter>
            );
        };

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
